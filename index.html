<!DOCTYPE html>
<html>
    <head>
        <!-- 웹페이지 보이지는 않지만, 필요한 설정을 해두는 곳이에요.
             우리가 집을 위해 미리 생각 해놓은 것을 적어두는 곳이라고 할 수 있죠!-->
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta property="og:title" content="피타 - 와동초 링크" />
        <meta property="og:description" content="경기도 안산시 와동초등학교" />
        <meta property="og:image" content="공유할 이미지" />
        <title>와동초 프로필</title>
           <style>
                @font-face {
                    font-family: 'HSGooltokki';
                    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2210-2@1.0/HSGooltokki.woff2') format('woff2');
                    font-weight: normal;
                    font-style: normal;
                }
                * {
                    font-family: 'HSGooltokki';
                }
                body {
                    background-color:#13eab1;
                    background-image: url('spring.jpg');
                }
                .profile {
                    width: 200px;
                    height: 100px;
                    border-radius: 40%;
                    border: 2px solid white;
                    background-image: url('wadong.png');
                    background-position: center;
                    background-size: cover;
                }
                .main {
                    color : #f3fcfb;
                    font-size: 22px;
                    size : 20px;
                    margin-top: 20px;
                    margin-bottom: 5px;
                }
                .sub {
                    color : #ecfffd;
                    font-size: 14px;
                    font-weight: 400;
                    size : 14px;
                    margin-top: 0px;
                    margin-bottom: 10px;
                }
                .wrap {
                    width: 300px;
                    margin: 30px auto 0px auto;
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    align-items: center;
                }
                .bigbutton {
                    width: 320px;
                    height: 46px;
                    border-radius: 10px;
                    background-color: #b3eeff;
                    margin-bottom: 5px;
                    font-size: 24px;
                    font-weight: none;
                    color:rgb(1, 72, 54);
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    align-items: center;
                    text-decoration: none;
                    box-shadow: 0px 2px 8px rgba(45, 44, 75, 0.24);
                }
                .minibutton {
                    width: 152px;
                    height: 46px;
                    border-radius: 10px;
                    background-color: #b3eeff;
                    margin-bottom: 5px;
                    font-size: 24px;
                    font-weight: none;
                    color:rgb(1, 72, 54);
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    align-items: center;
                    text-decoration: none;
                    box-shadow: 0px 2px 8px rgba(45, 44, 75, 0.24);
                    margin: 0px 8px 5px 8px;
                }
                .buttons {
                    display: flex;
                }
                .wrap > a:hover {
                    background-color: #f2f2f2;
                }
                .buttons > a:hover {
                    background-color: #f2f2f2;
                }
                .rtan {
                    width: 100px;
                    height: 100px;
                    background-image: url('hippig.png');
                    background-position: center;
                    background-size: cover;
                    position: absolute;
                    bottom: 63px;               
                }
                .pink {
                    width: 100%;
                    height: 95px;
                    background-color: #03a58a;
                    position : absolute;
                    bottom : 0;
                    
                }
            </style>
        </head>
        <body>
            <div class="wrap">
                <div class="profile"></div>
                <h1 class="main">와동초</h1>
                <p class="sub">경기도 안산시 와동초등학교.</p>
                <a class="bigbutton"target="_blank" href="https://docs.google.com/spreadsheets/d/1av-RSn4eTqNNIJ83rrFGilMnfAZweQ0Zc7cmCXvTIZA/edit?gid=639205880#gid=639205880">방과후학교 현황</a>
                <a class="bigbutton"target="_blank" href="https://docs.google.com/spreadsheets/d/1p5aPm8i3JY3cFS30JjVMypabroEEjV0uh2n0AHg-pw0/edit?gid=397018467#gid=397018467/">학교현황</a>
                <a class="bigbutton"target="_blank" href="https://docs.google.com/spreadsheets/d/1uMYTeHtsEfzVW3t4l8_mYTJc1I3L3YsAeSIgT985BUE/edit?gid=1104983796#gid=1104983796">돌봄현황</a>
                <a class="bigbutton"target="_blank" href="https://docs.google.com/spreadsheets/d/15BNHkX3Icw3x_r_D_DA7mPK5GjfnilluCT4xpkf91VQ/edit?copiedFromTrash=&gid=430883221#gid=430883221">아동명부</a>
                <a class="bigbutton"target="_blank" href="https://docs.google.com/spreadsheets/d/1wnGpqBwGZxRM_Ev4DYj3vw4bhUiIOvgqfS6AW7LmdEY/edit?gid=1358412054#gid=1358412054">학운위 안건취합</a>
                <div class="buttons">
                    <a class="minibutton" target="_blank"https://docs.google.com/spreadsheets/d/15BNHkX3Icw3x_r_D_DA7mPK5GjfnilluCT4xpkf91VQ/edit?copiedFromTrash=&gid=430883221#gid=430883221">아동명부</a>
                    <a class="minibutton"target="_blank" href="https://spartacodingclub.kr/community/blog">블로그</a>
                </div>
                <div class="pink"></div>
                <div class="rtan"></div>
            </div>
        </body>
        </html>
